<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tipografia da identidade -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

  <title>End Screen</title>

  <style>
    :root {
      --verde-profundo: #0F3D2E;
      --verde-musgo: #3F6F52;
      --verde-sinal: #8FE3B0;
      --dourado: #C99A44;
      --marfim: #F3EFE6;
      --tinta: #12201A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;

      background: var(--verde-profundo);
      color: var(--marfim);

      font-family: "Manrope", sans-serif;
    }

    .end-screen {
      position: relative;
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 82% 20%,
          rgba(143, 227, 176, 0.07),
          transparent 28%
        ),
        var(--verde-profundo);
    }

    /* Grid técnico discreto */
    .grid {
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(243, 239, 230, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(243, 239, 230, 0.035) 1px,
          transparent 1px
        );

      background-size: 48px 48px;

      mask-image: linear-gradient(
        to bottom,
        transparent,
        black 20%,
        black 80%,
        transparent
      );
    }

    .content {
      position: relative;
      z-index: 2;

      width: min(1100px, 85vw);

      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 80px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 24px;

      color: var(--verde-sinal);

      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: var(--verde-sinal);
      box-shadow: 0 0 16px rgba(143, 227, 176, 0.45);
    }

    h1 {
      max-width: 700px;

      font-family: "Newsreader", serif;
      font-size: clamp(52px, 6vw, 86px);
      font-weight: 400;
      font-style: italic;
      line-height: 0.95;
      letter-spacing: -0.035em;

      color: var(--marfim);
    }

    h1 span {
      color: var(--verde-sinal);
    }

    .description {
      max-width: 600px;

      margin-top: 28px;

      color: rgba(243, 239, 230, 0.72);

      font-size: 18px;
      line-height: 1.6;
    }

    /* Área de ações */
    .actions {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
    }

    .action {
      display: flex;
      align-items: center;
      gap: 14px;

      min-width: 230px;

      padding: 16px 20px;

      border: 1px solid rgba(243, 239, 230, 0.16);

      background: rgba(18, 32, 26, 0.35);

      color: var(--marfim);

      font-family: "Manrope", sans-serif;
      font-size: 15px;
      font-weight: 600;

      backdrop-filter: blur(8px);
    }

    .icon {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 30px;
      height: 30px;

      border-radius: 50%;

      background: var(--verde-sinal);
      color: var(--tinta);

      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      font-weight: 600;
    }

    .action.subscribe {
      border-color: rgba(143, 227, 176, 0.45);
    }

    .action.subscribe .icon {
      border-radius: 3px;
    }

    /* Metadado técnico */
    .meta {
      position: absolute;
      bottom: 42px;
      left: 7.5%;
      right: 7.5%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding-top: 18px;

      border-top: 1px solid rgba(243, 239, 230, 0.12);

      color: rgba(243, 239, 230, 0.42);

      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .meta .pass {
      color: var(--verde-sinal);
    }

    .corner {
      position: absolute;

      width: 28px;
      height: 28px;

      border-color: rgba(201, 154, 68, 0.65);
    }

    .corner.top-left {
      top: 36px;
      left: 36px;

      border-top: 1px solid;
      border-left: 1px solid;
    }

    .corner.bottom-right {
      right: 36px;
      bottom: 36px;

      border-right: 1px solid;
      border-bottom: 1px solid;
    }

    @media (max-width: 800px) {
      .content {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .actions {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .action {
        min-width: auto;
      }

      .description {
        font-size: 16px;
      }

      .meta {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <main class="end-screen">

    <div class="grid"></div>

    <div class="corner top-left"></div>
    <div class="corner bottom-right"></div>

    <div class="content">

      <section>
        <div class="eyebrow">
          <span class="status"></span>
          conteúdo entregue
        </div>

        <h1>
          Gostou do<br>
          <span>conteúdo?</span>
        </h1>

        <p class="description">
          Se este vídeo foi útil para você, inscreva-se no canal,
          deixe seu like e conte nos comentários o que achou.
        </p>
      </section>

      <section class="actions">

        <div class="action subscribe">
          <span class="icon">+</span>
          <span>INSCREVA-SE</span>
        </div>

        <div class="action">
          <span class="icon">♥</span>
          <span>DEIXE SEU LIKE</span>
        </div>

        <div class="action">
          <span class="icon">↳</span>
          <span>COMENTE</span>
        </div>

      </section>

    </div>

    <footer class="meta">
      <span>END_OF_VIDEO // THANKS_FOR_WATCHING</span>
      <span class="pass">STATUS: PASS</span>
    </footer>

  </main>

</body>
</html>
