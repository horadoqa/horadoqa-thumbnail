<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Testes Manuais — YouTube Thumbnail</title>

  <!-- =====================================================
       FONTES
  ====================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap"
    rel="stylesheet">

  <style>
    /* =====================================================
       DESIGN TOKENS
    ====================================================== */

    :root {
      --deep-green: #0F3D2E;
      --moss: #3F6F52;
      --signal: #8FE3B0;
      --gold: #C99A44;
      --ivory: #F3EFE6;
      --ink: #12201A;

      --line-light: rgba(243, 239, 230, 0.18);
      --line-dark: rgba(18, 32, 26, 0.18);
    }


    /* =====================================================
       RESET
    ====================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 32px;

      background: #091a13;

      font-family: "Manrope", sans-serif;
    }


    /* =====================================================
       THUMBNAIL
    ====================================================== */

    .thumbnail {
      position: relative;

      width: min(1280px, 100%);

      aspect-ratio: 16 / 9;

      overflow: hidden;

      isolation: isolate;

      color: var(--ivory);

      background: var(--deep-green);

      box-shadow:
        0 35px 90px rgba(0, 0, 0, 0.42);
    }


    /* =====================================================
       FUNDO PRINCIPAL
    ====================================================== */

    .thumbnail::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: -3;

      background:
        linear-gradient(110deg,
          var(--deep-green) 0%,
          var(--deep-green) 47%,
          #315E48 100%);
    }


    /* =====================================================
       BLOCO MARFIM
    ====================================================== */

    .thumbnail::after {
      content: "";

      position: absolute;

      width: 61%;
      height: 155%;

      right: -19%;
      top: -26%;

      z-index: -2;

      background: var(--ivory);

      transform: rotate(10deg);
    }


    /* =====================================================
       GRID TÉCNICO
    ====================================================== */

    .technical-grid {
      position: absolute;

      inset: 0;

      z-index: -1;

      opacity: 0.075;

      background-image:
        linear-gradient(rgba(243, 239, 230, 0.8) 1px,
          transparent 1px),
        linear-gradient(90deg,
          rgba(243, 239, 230, 0.8) 1px,
          transparent 1px);

      background-size: 46px 46px;

      mask-image:
        linear-gradient(90deg,
          black 0%,
          transparent 72%);
    }


    /* =====================================================
       HEADER
    ====================================================== */

    .topbar {
      position: absolute;

      top: 5.5%;
      left: 5.2%;
      right: 5.2%;

      display: flex;

      justify-content: space-between;

      align-items: center;

      font-family: "JetBrains Mono", monospace;

      font-size: clamp(8px, 0.75vw, 12px);

      font-weight: 600;

      letter-spacing: 0.14em;

      text-transform: uppercase;
    }

    .topbar-left {
      display: flex;

      align-items: center;

      gap: 9px;

      color: var(--signal);
    }

    .status-dot {
      width: 7px;
      height: 7px;

      flex-shrink: 0;

      border-radius: 50%;

      background: var(--signal);

      box-shadow:
        0 0 0 3px rgba(143, 227, 176, 0.12);
    }

    .topbar-right {
      color: rgba(243, 239, 230, 0.48);
    }


    /* =====================================================
       LOGO
    ====================================================== */

    .logo-wrapper {
      position: absolute;

      top: 4.5%;
      right: 5.2%;

      z-index: 5;

      width: clamp(46px, 6vw, 82px);

      aspect-ratio: 1;
    }

    .logo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      border-radius: 50%;

      background: var(--moss);

      border: 2px solid var(--ivory);

      box-shadow:
        0 0 0 6px rgba(15, 61, 46, 0.25);
    }


    /* =====================================================
       CONTEÚDO PRINCIPAL
    ====================================================== */

    .main-content {
      position: absolute;

      left: 5.2%;
      top: 23%;

      width: 55%;
    }


    /* =====================================================
       EYEBROW
    ====================================================== */

    .eyebrow {
      display: inline-flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 3%;

      color: var(--signal);

      font-family: "JetBrains Mono", monospace;

      font-size: clamp(9px, 0.95vw, 14px);

      font-weight: 600;

      letter-spacing: 0.08em;

      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";

      width: 25px;
      height: 1px;

      background: var(--gold);
    }


    /* =====================================================
       TÍTULO
    ====================================================== */

    h1 {
      margin: 0;

      color: var(--ivory);

      font-family: "Newsreader", serif;

      font-style: italic;

      font-weight: 600;

      font-size: clamp(58px, 8.8vw, 138px);

      line-height: 0.78;

      letter-spacing: -0.06em;
    }


    /* =====================================================
       SUBTÍTULO
    ====================================================== */

    .subtitle {
      max-width: 520px;

      margin: 5% 0 0;

      color: rgba(243, 239, 230, 0.78);

      font-family: "Manrope", sans-serif;

      font-size: clamp(9px, 1vw, 15px);

      font-weight: 700;

      line-height: 1.45;

      letter-spacing: 0.035em;

      text-transform: uppercase;
    }


    /* =====================================================
       RESULTADO DOS TESTES MANUAIS
    ====================================================== */

    .test-status {
      position: absolute;

      left: 5.2%;
      bottom: 7%;

      width: min(52%, 560px);

      padding-top: 13px;

      border-top: 1px solid var(--line-light);

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;

      font-family: "JetBrains Mono", monospace;

      font-size: clamp(7px, 0.72vw, 11px);

      color: rgba(243, 239, 230, 0.52);

      text-transform: uppercase;
    }

    .test-item {
      min-width: 0;
    }

    .test-label {
      display: block;

      margin-bottom: 5px;

      letter-spacing: 0.04em;
    }

    .test-value {
      display: block;

      color: var(--ivory);

      font-weight: 600;
    }

    .test-value.pass {
      color: var(--signal);
    }


    /* =====================================================
       ÁREA DE TESTES MANUAIS
    ====================================================== */

    .tool-area {
      position: absolute;

      right: 6%;
      bottom: 10%;

      width: 36%;
      height: 59%;

      display: grid;

      place-items: center;
    }


    /* =====================================================
       MOLDURA
    ====================================================== */

    .tool-frame {
      position: relative;

      width: min(100%, 400px);

      aspect-ratio: 1.08;

      display: grid;

      place-items: center;

      background:
        rgba(243, 239, 230, 0.55);

      border: 1px solid var(--line-dark);

      transform: rotate(-3deg);
    }


    /* =====================================================
       CANTOS EDITORIAIS
    ====================================================== */

    .tool-frame::before,
    .tool-frame::after {
      content: "";

      position: absolute;

      width: 30px;
      height: 30px;

      border-color: var(--gold);

      border-style: solid;
    }

    .tool-frame::before {
      left: -7px;
      top: -7px;

      border-width:
        2px 0 0 2px;
    }

    .tool-frame::after {
      right: -7px;
      bottom: -7px;

      border-width:
        0 2px 2px 0;
    }


    /* =====================================================
       IMAGEM / ILUSTRAÇÃO DE TESTES MANUAIS
    ====================================================== */

    .manual-testing-image {
      display: block;

      width: 70%;
      height: 70%;

      object-fit: contain;
    }


    /* =====================================================
       BADGE
    ====================================================== */

    .verified-badge {
      position: absolute;

      right: 4%;
      bottom: 4%;

      padding: 8px 11px;

      background: var(--deep-green);

      color: var(--signal);

      font-family: "JetBrains Mono", monospace;

      font-size: clamp(7px, 0.75vw, 11px);

      font-weight: 700;

      letter-spacing: 0.1em;
    }


    /* =====================================================
       LABEL VERTICAL
    ====================================================== */

    .vertical-label {
      position: absolute;

      right: 5.1%;
      top: 19%;

      color: rgba(18, 32, 26, 0.48);

      font-family: "JetBrains Mono", monospace;

      font-size: clamp(7px, 0.7vw, 10px);

      font-weight: 600;

      line-height: 1.2;

      letter-spacing: 0.12em;

      writing-mode: vertical-rl;

      text-transform: uppercase;
    }


    /* =====================================================
       DETALHES EDITORIAIS
    ====================================================== */

    .gold-line {
      position: absolute;

      left: 5.2%;
      top: 15%;

      width: 55px;
      height: 2px;

      background: var(--gold);
    }

    .index {
      position: absolute;

      left: 5.2%;
      top: 15%;

      transform: translateX(70px);

      color: rgba(243, 239, 230, 0.4);

      font-family: "JetBrains Mono", monospace;

      font-size: 9px;

      letter-spacing: 0.12em;
    }


    /* =====================================================
       RESPONSIVIDADE
    ====================================================== */

    @media (max-width: 700px) {

      body {
        padding: 10px;
      }

      .main-content {
        width: 58%;

        top: 25%;
      }

      .tool-area {
        right: 4%;

        width: 38%;
      }

      .test-status {
        width: 55%;
      }

      .subtitle {
        max-width: 260px;
      }
    }


    @media (max-width: 480px) {

      body {
        padding: 5px;
      }

      .main-content {
        top: 27%;
      }

      .test-status {
        bottom: 5%;

        width: 56%;
      }

      .tool-area {
        right: 3%;

        bottom: 11%;

        width: 39%;
      }
    }
  </style>
</head>


<body>

  <!-- =====================================================
       THUMBNAIL
  ====================================================== -->

  <main class="thumbnail">


    <!-- ===================================================
         GRID TÉCNICO
    ==================================================== -->

    <div class="technical-grid" aria-hidden="true">
    </div>


    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header class="topbar">

      <div class="topbar-left">

        <span class="status-dot"></span>

        MANUAL TESTING

      </div>


      <div class="topbar-right">

        QA / 001

      </div>

    </header>


    <!-- ===================================================
         LOGO
    ==================================================== -->

    <div class="logo-wrapper">

      <img class="logo" src="logo.png" alt="Logo">

    </div>


    <!-- ===================================================
         DETALHE EDITORIAL
    ==================================================== -->

    <div class="gold-line"></div>


    <div class="index">

      01 / QUALITY ASSURANCE

    </div>


    <!-- ===================================================
         CONTEÚDO PRINCIPAL
    ==================================================== -->

    <section class="main-content">


      <div class="eyebrow">

        Quality Assurance

      </div>


      <h1>

        Testes<br>
        Manuais

      </h1>


      <p class="subtitle">

        Planejar. Executar. Encontrar.
        Validar com confiança.

      </p>

    </section>


    <!-- ===================================================
         RESULTADO DOS TESTES
    ==================================================== -->

    <section class="test-status" aria-label="Manual testing execution results">

      <div class="test-item">

        <span class="test-label">
          TESTES
        </span>

        <strong class="test-value">
          30
        </strong>

      </div>


      <div class="test-item">

        <span class="test-label">
          PASSARAM
        </span>

        <strong class="test-value pass">
          24
        </strong>

      </div>


      <div class="test-item">

        <span class="test-label">
          FALHARAM
        </span>

        <strong class="test-value">
          4
        </strong>

      </div>


      <div class="test-item">

        <span class="test-label">
          BLOQUEADOS
        </span>

        <strong class="test-value">
          2
        </strong>

      </div>

    </section>



    <!-- ===================================================
         ÁREA DE TESTES MANUAIS
    ==================================================== -->

    <aside class="tool-area" aria-label="Imagem relacionada a testes manuais">


      <div class="tool-frame">


        <img class="manual-testing-image" src="manual-testing.png" alt="Testes Manuais">


        <!-- Badge -->

        <span class="verified-badge">

          ✓ VERIFIED

        </span>


      </div>

    </aside>


    <!-- ===================================================
         LABEL VERTICAL
    ==================================================== -->

    <div class="vertical-label">

      manual testing /
      quality by observation

    </div>


  </main>

</body>

</html>
