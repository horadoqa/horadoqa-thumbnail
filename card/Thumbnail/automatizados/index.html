<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Testes Automatizados — QA Automation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/style.css" />
</head>


<body>

  <main class="thumbnail">


    <!-- ===================================================
         GRID TÉCNICO
    ==================================================== -->

    <div class="technical-grid" aria-hidden="true">
    </div>


    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header class="topbar">

      <div class="topbar-left">

        <span class="status-dot"></span>

        AUTOMATED TESTING

      </div>


      <div class="topbar-right">

        QA / 001

      </div>

    </header>


    <!-- ===================================================
         LOGO
    ==================================================== -->

    <div class="logo-wrapper">

      <img class="logo" src="../assets/images/logo.png" alt="Logo">

    </div>


    <!-- ===================================================
         DETALHE EDITORIAL
    ==================================================== -->

    <div class="gold-line"></div>


    <div class="index">

      01 / QA AUTOMATION

    </div>


    <!-- ===================================================
         CONTEÚDO PRINCIPAL
    ==================================================== -->

    <section class="main-content">


      <div class="eyebrow">

        QA Automation

      </div>


      <h1>

        Testes<br>
        Automatizados

      </h1>


      <p class="subtitle">

        Executar. Validar. Repetir.
        Qualidade em escala.

      </p>

    </section>


    <!-- ===================================================
         RESULTADOS DOS TESTES
    ==================================================== -->

    <section class="test-status" aria-label="Automated testing results">


      <div class="test-item">

        <span class="test-label">
          TESTES
        </span>

        <strong class="test-value">
          48
        </strong>

      </div>


      <div class="test-item">

        <span class="test-label">
          PASSARAM
        </span>

        <strong class="test-value pass">
          46
        </strong>

      </div>


      <div class="test-item">

        <span class="test-label">
          FALHARAM
        </span>

        <strong class="test-value">
          2
        </strong>

      </div>


      <div class="test-item">

        <span class="test-label">
          SUCESSO
        </span>

        <strong class="test-value pass">
          95.8%
        </strong>

      </div>

    </section>


    <!-- ===================================================
         ÁREA DE AUTOMAÇÃO
    ==================================================== -->

    <aside class="tool-area" aria-label="Imagem relacionada a testes automatizados">


      <div class="tool-frame">


        <img class="automation-image" src="automated-testing.png" alt="Testes Automatizados">


        <span class="verified-badge">

          ✓ AUTOMATED

        </span>


      </div>

    </aside>


    <!-- ===================================================
         LABEL VERTICAL
    ==================================================== -->

    <div class="vertical-label">

      automated testing /
      quality at scale

    </div>


  </main>

</body>

</html>
